# gs-build v5 — managed by the desktop's gha-build (do not edit: it is rewritten on change)
name: gs-build
run-name: gs ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job: {required: true, type: string}
      kind: {required: true, type: string}
      flutter: {required: false, type: string, default: "0"}
      fver: {required: false, type: string, default: ""}
      targets: {required: false, type: string, default: "android-arm64"}
      pname: {required: false, type: string, default: "app"}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JOB: ${{ inputs.job }}
      KIND: ${{ inputs.kind }}
      TARGETS: ${{ inputs.targets }}
    steps:
      - name: fetch (encrypted)
        env: {GH_TOKEN: "${{ github.token }}", GS_KEY: "${{ secrets.GS_KEY }}"}
        run: |
          set -euo pipefail
          case "$JOB" in *[!a-f0-9]*|"") echo bad job; exit 2;; esac
          case "${{ inputs.pname }}" in *[!A-Za-z0-9_.-]*|"") echo bad name; exit 2;; esac
          gh release download inbox -R "$GITHUB_REPOSITORY" -p "$JOB.enc" -O src.enc
          mkdir -p p && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:GS_KEY -in src.enc | tar xz -C p
          rm -f src.enc
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        if: inputs.flutter == '1'
        with: {channel: stable, flutter-version: "${{ inputs.fver }}", cache: true}
      - name: restore caches
        id: c
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            ~/.android/build-cache
          key: gs-v3-${{ inputs.flutter }}-${{ github.run_id }}
          restore-keys: gs-v3-${{ inputs.flutter }}-
      - name: restore project build state
        uses: actions/cache/restore@v4
        with:
          path: |
            p/build
            p/.dart_tool
            p/android/.gradle
            p/android/app/build
            p/.gradle
            p/app/build
          key: gs-proj-v3-${{ inputs.pname }}-${{ github.run_id }}
          restore-keys: gs-proj-v3-${{ inputs.pname }}-
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.flutter != '1'
        with: {gradle-version: "8.9", cache-disabled: true}
      - name: tune for 4 vCPU / 16 GB
        run: |
          # v178: the desktop clamps Gradle to 2 workers / 1.5 GB (2-core machine) — on the runner use all of it
          for f in p/gradle.properties p/android/gradle.properties; do
            [ -f "$f" ] || continue
            sed -i -E '/^org\.gradle\.(jvmargs|workers\.max|parallel|caching)=/d; /^kotlin\.daemon\.jvmargs=/d' "$f"
            printf 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8\norg.gradle.workers.max=4\norg.gradle.parallel=true\norg.gradle.caching=true\nkotlin.daemon.jvmargs=-Xmx2g\n' >> "$f"
          done
      - name: build (output kept private)
        env: {GS_KEY: "${{ secrets.GS_KEY }}"}
        run: |
          set +e
          mkdir -p out
          keytool -genkeypair -keystore "$RUNNER_TEMP/t.jks" -storepass gsbuild -keypass gsbuild -alias gsrelease \
            -keyalg RSA -keysize 2048 -validity 10000 -dname CN=gs-gha-build >/dev/null 2>&1
          export GS_ANDROID_KEYSTORE="$RUNNER_TEMP/t.jks" GS_ANDROID_KEYSTORE_PASS=gsbuild GS_ANDROID_KEY_ALIAS=gsrelease \
                 GS_ANDROID_KEY_PASS=gsbuild GS_ANDROID_SIGNING_PROPS=/nonexistent CI=true
          cd p
          {
            echo "[runner] $(nproc) vCPU · $(free -g | awk '/Mem/{print $2}') GB RAM"
            if [ "${{ inputs.flutter }}" = 1 ]; then
              flutter --version | head -1
              if [ "$KIND" = web ]; then
                [ -d web ] || flutter create --platforms web --project-name "$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -1)" . >/dev/null
                flutter build web --release -O1 --no-wasm-dry-run --no-web-resources-cdn && tar czf ../out/web.tgz -C build/web . && {
                  # v179: the render check also runs here (was a headless Chrome on the 2-core desktop)
                  sed -i 's#<base href="[^"]*">#<base href="./">#' build/web/index.html
                  ( cd build/web && python3 -m http.server 8686 --bind 127.0.0.1 >/dev/null 2>&1 & echo $! > ../../../out/srv.pid )
                  sleep 1
                  timeout 60 google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --no-first-run --disable-extensions \
                    --use-angle=swiftshader --enable-unsafe-swiftshader --user-data-dir="$RUNNER_TEMP/chp" --window-size=360,640 \
                    --hide-scrollbars --virtual-time-budget=15000 --enable-logging=stderr --v=0 \
                    --screenshot="$PWD/../out/render.png" http://127.0.0.1:8686/ > ../out/render.log 2>&1 || true
                  kill "$(cat ../out/srv.pid)" 2>/dev/null; rm -f ../out/srv.pid; true; }
              elif [ "$KIND" = analyze ] || [ "$KIND" = test ]; then
                # v186: test discovery via find (ls test/**/… without globstar missed the default test/widget_test.dart)
                # v181: the agent's quality gate (pub get + analyze [+ tests]) — was run on the 2-core desktop
                flutter pub get; r=$?
                if [ $r -eq 0 ]; then flutter analyze --no-fatal-infos --no-fatal-warnings; r=$?; fi
                if [ "$KIND" = test ]; then
                  if [ -n "$(find test -name '*_test.dart' 2>/dev/null | head -1)" ]; then flutter test --no-pub; t=$?; [ $r -eq 0 ] && r=$t
                  else echo "NO_TESTS"; fi
                fi
                cp -f pubspec.lock ../out/pubspec.lock 2>/dev/null
                (exit $r)
              else
                printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
                flutter build apk --"$KIND" --target-platform "$TARGETS" && \
                  cp "$(ls -t build/app/outputs/flutter-apk/*.apk | head -1)" ../out/app.apk
              fi
            else
              printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
              [ -f gradle.properties ] && sed -i -E '/^org\.gradle\.(java\.home|jvmargs)=/d' gradle.properties
              T=assembleDebug; [ "$KIND" = release ] && T=assembleRelease
              if [ "$KIND" = analyze ]; then gradle --console=plain --warning-mode=none --build-cache --parallel compileDebugSources
              elif [ "$KIND" = test ]; then
                case "$TARGETS" in *[!A-Za-z0-9:_-]*|"") TARGETS=testDebugUnitTest;; esac
                gradle --console=plain --warning-mode=none --build-cache --parallel "$TARGETS"; r=$?
                find . -path '*/build/test-results/*' -name '*.xml' | tar czf ../out/tests.tgz -T - 2>/dev/null; (exit $r)
              else
              gradle --console=plain --warning-mode=none --build-cache --parallel "$T" && \
                cp "$(find app/build/outputs/apk -name '*.apk' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)" ../out/app.apk
              fi
            fi
          } > ../out/build.log 2>&1
          echo $? > ../out/rc
          cd ..
          (cd p/android 2>/dev/null && ./gradlew --stop >/dev/null 2>&1) || gradle --stop >/dev/null 2>&1 || true
          tar czf - -C out . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:GS_KEY -out res.enc
          echo "rc=$(cat out/rc)"
      - uses: actions/upload-artifact@v4
        with: {name: "res-${{ inputs.job }}", path: res.enc, retention-days: 1, compression-level: 0}
      - name: save project build state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            p/build
            p/.dart_tool
            p/android/.gradle
            p/android/app/build
            p/.gradle
            p/app/build
          key: gs-proj-v3-${{ inputs.pname }}-${{ github.run_id }}
      - name: save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            ~/.android/build-cache
          key: gs-v3-${{ inputs.flutter }}-${{ github.run_id }}
